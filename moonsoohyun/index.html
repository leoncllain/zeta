<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17241e"><title>雨期 · 우기 | 정유철의 저택</title><style>
:root{color-scheme:dark;--bg:#17241e;--paper:#e9e2cd;--gold:#c7b28a;--muted:#9eac9d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#293c30,#111c17 75%);color:var(--paper);font-family:Georgia,'Noto Serif KR','Batang',serif;line-height:1.65}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #a58d615d;background:#17241edb;border-radius:3px;padding:8px 12px}button:hover,button:focus-visible{border-color:#e6cda1;background:#384b38}button:focus-visible{outline:2px solid #e6cda1;outline-offset:3px}header,main,footer{max-width:1050px;margin:auto;padding:16px}header{text-align:center;padding-top:32px}.eyebrow{font:10px system-ui;letter-spacing:.35em;color:var(--gold)}h1{font-weight:400;font-size:clamp(32px,6vw,56px);letter-spacing:.16em;margin:5px 0}header p{margin:0;color:#c4cbbd;font-size:14px}nav{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:18px;font:12px system-ui}nav button{padding:8px 10px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;flex-wrap:wrap}.toolbar h2{font-size:19px;font-weight:400;margin:0}.time[hidden]{display:none}.time{display:flex;gap:4px;font:12px system-ui}.time button[aria-pressed=true]{background:#c7b28a;color:#17241e}.stage{position:relative;aspect-ratio:4/3;overflow:hidden;border:1px solid #a58d617a;background:#101a15;box-shadow:0 14px 50px #0005}.stage img{width:100%;height:100%;object-fit:contain;display:block;animation:appear .6s ease}@keyframes appear{from{opacity:.25}to{opacity:1}}.spot{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:5px;white-space:nowrap;font:clamp(10px,2.6vw,13px) system-ui;padding:6px 9px;background:#101b15db;border:1px solid #e1cba98c;border-radius:30px;box-shadow:0 2px 10px #0007;z-index:2}.spot i{width:7px;height:7px;background:#ffe0a3;border-radius:50%;box-shadow:0 0 9px #ffd28b;animation:pulse 2.6s infinite}.spot.obj{padding:8px;min-width:30px;min-height:30px;justify-content:center}.spot.obj span{display:none}.spot.obj:hover span,.spot.obj:focus-visible span{display:inline}@keyframes pulse{50%{opacity:.45;box-shadow:0 0 15px #ffd28b}}.rain{position:absolute;inset:0;pointer-events:none;overflow:hidden}.drop{position:absolute;top:-15%;width:1px;height:12%;background:linear-gradient(transparent,#d5e6ef75);animation:fall linear infinite}@keyframes fall{to{transform:translate(-25px,1000px)}}.description{text-align:center;padding:20px 10px 5px;font-size:15px;word-break:keep-all}.hint{text-align:center;font:11px system-ui;color:var(--muted);margin:8px 0 16px}.links{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font:12px system-ui}.links button{background:transparent}.links .found{border-color:#78906f;color:#c8d9b8}.section{margin:26px 0;border-top:1px solid #8d805443;padding-top:18px}.section h3{font-size:17px;font-weight:400;margin:0 0 12px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{padding:0;overflow:hidden;text-align:left;background:#243229;border:1px solid #a58d6155}.tile img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.tile span{display:block;padding:8px;font-size:13px}.tile.profile img{aspect-ratio:4/5}.overlay{position:fixed;inset:0;background:#070e0bdc;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(5px)}.overlay[hidden]{display:none}.dialog{position:relative;width:min(680px,100%);max-height:90dvh;overflow:auto;background:#eee6d4;color:#3e3a31;border:1px solid #c0aa82;box-shadow:0 20px 80px #0009;padding:20px}.dialog .close{position:sticky;float:right;top:0;z-index:2;background:#eee6d4;color:#3e3a31;border:1px solid #9d8868;font:20px system-ui;width:38px;height:38px;padding:0}.dialog img{width:100%;max-height:48vh;object-fit:contain;background:#d7cbb7;display:block;margin:12px auto}.dialog h2{font-size:23px;font-weight:400;margin:10px 0}.dialog .record{white-space:pre-wrap;font-size:15px;line-height:1.9;word-break:keep-all}.dialog button.more{color:#54452f;background:transparent;margin-top:15px}.dialog small{color:#79694e;letter-spacing:.12em}.dialog .gallery{grid-template-columns:repeat(2,1fr)}.dialog .tile{color:#eee6d4}.mapgroup{margin:12px 0}.mapgroup button{color:#3e3a31;background:transparent;margin:3px}.progress{font:12px system-ui;color:var(--muted)}footer{text-align:center;color:#92a092;font:11px system-ui;padding:25px 16px 40px} @media(max-width:500px){header{padding-top:22px}main{padding:9px}.toolbar h2{font-size:16px}.spot{padding:5px 6px}.gallery{gap:6px}.tile span{font-size:11px;padding:6px}.dialog{padding:14px}.description{font-size:14px}.stage{border-radius:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style></head><body><header><div class="eyebrow">THE RAINY SEASON</div><h1>雨期 · 우기</h1><p>소설가의 아내를 사랑한 문하생</p><nav><button id="homeBtn">저택 외관</button><button id="mapBtn">공간 안내</button><button id="peopleBtn">인물</button><button id="memoryBtn">지난 기록</button><button id="logBtn">발견 기록</button><button id="audioBtn" aria-pressed="false">♪ 빗소리 켜기</button></nav></header><main><div class="toolbar"><h2 id="roomTitle"></h2><div class="time" id="time"><button data-time="morning">비 갠 아침</button><button data-time="rain">비 내리는 낮</button><button data-time="night">장마의 밤</button></div></div><div class="stage" id="stage"><img id="scene" alt=""><div id="rainLayer" class="rain"></div><div id="spots"></div></div><p class="description" id="desc"></p><div class="hint">빛나는 위치를 눌러 공간을 이동하거나 물건을 살펴보세요.</div><div class="links" id="links"></div><div class="section"><h3>저택에 남은 이야기 <span class="progress" id="progress"></span></h3><div class="gallery" id="gallery"></div></div></main><footer>雨期 · 우기 | 창작 세계관 체험 페이지 · 실제 인물 및 장소와 무관합니다.</footer><div class="overlay" id="overlay" hidden><article class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><button class="close" id="close" aria-label="닫기">×</button><div id="dialogBody"></div></article></div><script>
const D={"rooms": {"home": ["산속 저택", "rain", "산이 여름을 머금으면 정유철의 저택은 한 폭의 수채화가 되었다.", [["2", 49, 67, "현관"], ["4", 15, 49, "화실"], ["3", 55, 53, "서재"], ["6", 39, 29, "복층 방"], ["7", 59, 32, "부부 침실"], ["5", 88, 57, "온실"], ["8", 20, 80, "수국 정원"], ["12", 70, 70, "툇마루"]], []], "2": ["현관과 복도", "room2", "벽마다 걸린 그림과 젖은 나무 바닥. 이 집에 들어온 사람들은 먼저 그림을 마주한다.", [["3", 73, 48, "서재"], ["4", 88, 56, "화실"], ["15", 59, 43, "계단"], ["10", 76, 66, "식당"], ["12", 12, 65, "툇마루"]], []], "3": ["정유철의 서재", "room3", "비가 내리는 날이면 유철은 하루 종일 이곳에 머문다. 수현은 스승의 원고를 교정한다.", [["2", 8, 91, "복도"]], [[1, 35, 55], [2, 23, 32], [3, 21, 47]]], "4": ["정유철의 화실", "room4", "낮은 조명 아래 놓인 이젤과 소파. 장마철 밤마다 연작 《우기》의 삽화가 그려진다.", [["14", 8, 92, "밤의 복도"], ["2", 88, 92, "현관"]], [[4, 70, 48], [5, 88, 69], [6, 25, 60]]], "5": ["유리 온실", "room5", "그녀가 직접 돌보는 수국과 고사리, 허브. 두 사람이 원고를 나누어 읽는 곳이다.", [["8", 13, 87, "정원"], ["12", 83, 87, "툇마루"]], [[13, 49, 56], [14, 86, 51], [15, 67, 69]]], "6": ["문수현의 복층 방", "room6", "한때 그녀가 작가를 꿈꾸며 머물렀던 방. 지금은 수현의 원고가 책상 위에 놓여 있다.", [["15", 11, 80, "계단"]], [[7, 80, 53], [9, 32, 54]]], "7": ["부부의 침실", "room7", "유철이 고른 흰 침구와 옷. 그녀가 아직 간직하는 문하생 시절의 원고가 서랍 속에 있다.", [["15", 10, 93, "계단"]], [[10, 95, 70], [11, 85, 57], [12, 96, 44]]], "8": ["수국 정원", "room8", "빗물이 고인 돌길과 만발한 수국. 정원을 지나면 온실과 계곡으로 향할 수 있다.", [["home", 32, 32, "저택"], ["5", 77, 44, "온실"], ["9", 72, 80, "정자"], ["13", 51, 72, "산책로"], ["12", 40, 56, "툇마루"]], []], "9": ["계곡 옆 정자", "room9", "비가 내리는 오후, 두 사람은 나란히 앉아 책을 읽거나 물소리를 듣는다.", [["13", 78, 76, "산책로"], ["8", 15, 88, "정원"]], [[16, 40, 59], [18, 36, 25]]], "10": ["식당", "room10", "세 사람이 한 식탁에 앉는다. 유철이 정한 일과는 식사 시간에도 이어진다.", [["11", 15, 56, "주방"], ["2", 84, 85, "복도"]], []], "11": ["주방", "room11", "커피 향이 퍼지는 아침. 수현은 그녀가 좋아하는 커피를 기억한다.", [["10", 12, 87, "식당"], ["12", 86, 84, "툇마루"]], []], "12": ["툇마루", "room12", "처마 끝에서 떨어지는 빗물. 문을 열어 두면 온실과 수국 정원이 보인다.", [["5", 58, 43, "온실"], ["8", 83, 71, "정원"], ["2", 12, 50, "현관"]], [[18, 55, 18]]], "13": ["산책로", "room13", "맑은 날 오후 네 시부터 여섯 시까지 유철은 홀로 이 길을 걷는다.", [["home", 31, 25, "저택"], ["9", 80, 60, "정자"], ["8", 45, 80, "정원"]], []], "14": ["밤의 화실 앞 복도", "room14", "장마가 시작된 밤. 교정을 마친 원고를 들고 가던 수현은 문틈의 빛 앞에서 멈췄다.", [["4", 51, 57, "화실"], ["2", 12, 90, "복도"]], []], "15": ["2층으로 향하는 계단", "room15", "벽에 걸린 그림을 지나 위층으로 오르면 두 개의 방이 있다.", [["6", 75, 27, "복층 방"], ["7", 57, 44, "부부 침실"], ["2", 24, 90, "1층 복도"]], []]}, "objects": {"1": ["교정 원고", "object1", "《우기》 교정지\n\n오늘 수정한 문장에는 비 오는 밤, 남편의 모델이 된 여자가 등장한다. 수현은 쉼표 하나까지 공들여 고쳤다. 그 문장을 화실 앞에서 다시 떠올리기 전까지는 아름다운 소설이라고 믿었다.", 6], "2": ["정유철의 소설책", "object2", "《우기》\n\n정유철의 소설과 직접 그린 삽화가 함께 놓여 있다. 세상은 그의 아내를 영원한 뮤즈라 부른다.", null], "3": ["부부의 사진 액자", "object3", "5년 전, 그녀는 스승의 아내가 되었다. 당시 그녀는 스물여섯이었다. 사진 속 정원에는 지금과 같은 수국이 피어 있다.", 2], "4": ["연작 《우기》", "object4", "작업 기록 · 장마 첫날\n\n흰 리넨. 낮은 조명. 비애(悲哀).\n\n“슬픔이 반드시 눈물의 모양을 하고 있을 필요는 없지. 울지 못하는 얼굴에도 비는 내리니까.”", 6], "5": ["팔레트와 붓", "object5", "유철의 작업 메모\n\n창밖의 푸른빛과 실내의 호박빛을 함께 남길 것. 표정이 흐트러지기 전에 눈가를 그려 둘 것.", null], "6": ["흰 리넨과 소파", "object6", "“조금만 더 참으렴, 여보. 오늘 밤은 지나가도 그림 속의 여름은 영원할 테니.”\n\n그날 밤 유철의 붓질은 멈추지 않았다.", 6], "7": ["수현의 습작 노트와 응모 원고", "object7", "수현의 습작 노트\n\n그녀는 오늘 내 원고에서 세 문장을 지웠다. 그중 하나는 내가 제일 좋아하던 문장이었다. 지우고 나니 글이 더 좋아졌다.\n\n나는 내일도 그녀에게 원고를 보여 줄 생각이다. 틀린 문장이 없어도.\n\n책상에는 신춘문예에 다시 응모할 단편도 놓여 있다.", 4], "9": ["수국 책갈피", "object7", "말린 수국 한 조각이 책 사이에 끼워져 있다. 함께 읽던 페이지를 잊지 않으려 남겨 둔 것이다.", 5], "10": ["서랍 속 미완성 소설", "object10", "6년 전 · 미완성 원고\n\n오늘부터 선생님의 저택에서 지내게 되었다. 내 방에는 작은 책상이 있고, 창문을 열면 계곡물 소리가 들린다. 이곳이라면 무슨 이야기든 쓸 수 있을 것 같다.\n\n언젠가 내 이름이 적힌 책을 이 집의 책장에도 꽂아 두고 싶다.", 1], "11": ["오래된 일기장", "object11", "문하생 시절의 기록\n\n오늘 선생님께 원고를 보여 드렸다. 내일은 첫 장부터 다시 쓰기로 했다. 어렵지만 즐겁다.\n\n혼인 이후의 페이지는 비어 있다.", 1], "12": ["옷장 속 흰 원피스", "object12", "옷장에는 흰색과 아이보리색 옷이 가지런히 걸려 있다. 유철이 고른 옷들이다. 그녀가 문하생 시절 즐겨 입던 옷은 보이지 않는다.", 1], "13": ["찻잔 두 개", "object13", "두 사람의 오후\n\n“이 문장은 조금 덜어 내는 게 좋겠어요.”\n“그럼 다음 문장도 봐 주실래요? 커피는 제가 더 가져오겠습니다.”", 4], "14": ["화분 아래 접힌 쪽지", "object14", "오후 3시 50분\n\n오늘은 원고를 가져오지 않았습니다. 글을 봐 달라는 핑계 없이도 만나고 싶어서요.\n\n네 시에 온실에서 뵙겠습니다.\n— 수현", null], "15": ["식물 관리 노트", "object15", "수국, 고사리, 허브.\n\n그녀는 매일 온실을 돌본다. 수현은 그녀가 어느 화분부터 물을 주는지 기억한다.", null], "16": ["함께 읽던 책과 밑줄", "object16", "두 사람이 함께 읽던 책. 한 문장 아래 연필 자국이 남아 있다.\n\n“쓰지 못한 이야기에도 끝은 있는 걸까요?”\n“다시 쓰면 되지 않을까요.”", 5], "18": ["처마 끝 풍경", "object18", "바람이 불면 유리 풍경이 울린다. 빗소리 사이로 잠깐씩 들리는 맑은 소리.", null]}, "memories": [["6년 전의 문하생", "스물다섯의 그녀는 작가를 꿈꾸며 이 저택에 왔다. 지금 수현이 머무는 방은 당시 그녀의 방이었다."], ["5년 전의 혼인", "이듬해 그녀는 정유철의 아내가 되었다. 아이는 세상에 나오지 못했고, 미완성 원고도 세상에 나오지 못했다."], ["3월의 문수현", "신춘문예 최종심에서 떨어진 단편을 유철이 눈여겨보았다. 그해 봄 수현은 문하생으로 저택에 들어왔다."], ["두 사람의 온실", "원고를 함께 읽으며 가까워진 두 사람. 그녀가 문학 이야기를 할 때면 얼굴에 생기가 돌았다."], ["계곡 옆에서", "비가 내리는 날, 두 사람은 정자에 나란히 앉았다. 책을 읽지 않아도 함께 있는 시간이 좋았다."], ["장마가 시작된 밤", "교정 원고를 든 수현은 화실 앞에 멈췄다. 그녀와 눈이 마주쳤지만 끝내 문을 열지 못했다."]], "profiles": [["문수현", "student", "25세 · 185cm / 77kg · 작가 지망생", "문예창작과를 졸업하고 올해 3월부터 정유철의 문하생으로 지낸다. 짧은 문장으로 사람의 손과 일상을 쓰며 신춘문예에 다시 응모할 단편을 고친다. 스승의 작품을 존경하면서도 그의 아내에게 연민과 존중, 사랑을 느낀다. 그녀에게 원고를 먼저 보여 준다."], ["그녀", "wife", "31세 · 164cm · 정유철의 아내", "6년 전 작가를 꿈꾸며 저택에 들어왔고 이듬해 스승과 혼인했다. 혼인 후 글쓰기를 멈췄지만 문학적 감각은 여전하다. 온실을 직접 가꾸고 서랍 속에 미완성 소설을 간직한다."], ["정유철", "master", "55세 · 소설가 겸 화가", "베스트셀러 소설가이자 자기 소설의 삽화를 직접 그리는 화가. 아내를 자기 예술 세계의 일부로 여기고 옷차림과 생활을 통제한다. 수현의 재능을 아껴 신작 교정을 맡긴다. 두 사람의 관계는 아직 모른다."]]};const $=id=>document.getElementById(id);const path=n=>'assets/'+n+'.webp';let current='home',time='rain',seen=new Set(),visited=new Set(),lastFocus=null;try{seen=new Set(JSON.parse(localStorage.getItem('ugi-records')||'[]'));}catch(e){}function save(){try{localStorage.setItem('ugi-records',JSON.stringify([...seen]));}catch(e){}}function node(tag,txt,cls){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function button(label,fn,cls){let b=node('button',label,cls);b.onclick=fn;return b}function img(n,alt){let e=node('img');e.src=path(n);e.alt=alt;e.loading='lazy';return e}function tile(n,label,fn,cls=''){let b=button('',fn,'tile '+cls);b.append(img(n,label),node('span',label));return b}function updateProgress(){$('progress').textContent=` · 발견 ${seen.size}/${Object.keys(D.objects).length}`}
function rain(){let e=$('rainLayer');e.replaceChildren();if(current!=='home'||time==='morning')return;for(let i=0;i<32;i++){let s=node('i',undefined,'drop');s.style.left=(i*37%101)+'%';s.style.animationDuration=(.65+(i%7)*.12)+'s';s.style.animationDelay=-(i%11)*.17+'s';e.append(s)}}
function show(id,scroll=true){if(!D.rooms[id])return;current=id;visited.add(id);let r=D.rooms[id];$('roomTitle').textContent=r[0];$('scene').src=path(id==='home'?time:r[1]);$('scene').alt=r[0];$('desc').textContent=id==='home'?(time==='night'?'장마가 시작된 밤, 화실의 창에만 불빛이 남았다.':time==='morning'?'이튿날 아침, 산은 언제 비가 내렸느냐는 듯 눈부시게 화창했다.':r[2]):r[2];$('time').hidden=id!=='home';document.querySelectorAll('[data-time]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.time===time));$('spots').replaceChildren();$('links').replaceChildren();function spot(x,y,label,fn,isObj){let b=button('',fn,'spot'+(isObj?' obj':''));b.style.left=x+'%';b.style.top=y+'%';b.setAttribute('aria-label',label);b.title=label;b.append(node('i'),node('span',label));$('spots').append(b)}let links=r[3].slice();if(id==='home'&&time==='night')links=links.map(l=>l[0]==='4'?['14',l[1],l[2],'불 켜진 화실 앞']:l);links.forEach(([dest,x,y,label])=>{spot(x,y,label,()=>show(dest),false);$('links').append(button(label,()=>show(dest)))});r[4].forEach(([n,x,y])=>{let o=D.objects[n];spot(x,y,o[0],()=>openObject(n),true);$('links').append(button((seen.has(n)?'✓ ':'◇ ')+o[0],()=>openObject(n),seen.has(n)?'found':''))});if(id!=='home')$('links').append(button('저택 외관으로',()=>show('home')));if(id==='14')$('links').append(button('그날 밤의 기록',()=>openMemory(6)));if(id==='11')$('links').append(button('커피에 관한 기억',()=>openMemory(4)));if(id==='2')$('links').append(button('3월의 방문자',()=>openMemory(3)));rain();updateProgress();if(scroll)window.scrollTo({top:0,behavior:'smooth'})}
function dialog(title,kicker){lastFocus=document.activeElement;$('dialogBody').replaceChildren(node('small',kicker),node('h2',title));$('dialogBody').querySelector('h2').id='dialogTitle';$('overlay').hidden=false;document.body.style.overflow='hidden';$('close').focus();return $('dialogBody')}function close(){ $('overlay').hidden=true;document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)close();if(e.key==='Tab'&&!$('overlay').hidden){let a=[...$('overlay').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
function openObject(n){let o=D.objects[n];seen.add(n);save();updateProgress();let b=dialog(o[0],'PRIVATE RECORD');b.append(img(o[1],o[0]),node('div',o[2],'record'));if(o[3])b.append(button('관련 장면 보기 →',()=>openMemory(o[3]),'more'));if(n===18)b.append(button('풍경 소리 듣기',chime,'more'));}function openMemory(n){let m=D.memories[n-1];let b=dialog(m[0],'MEMORY · 0'+n);b.append(img('memory'+n,m[0]),node('div',m[1],'record'));if(n===6)b.append(button('화실 앞 복도로 이동',()=>{close();show('14')},'more'));}function openProfile(n){let p=D.profiles[n];let b=dialog(p[0],'CHARACTER');b.append(img(p[1],p[0]),node('h3',p[2]),node('div',p[3],'record'))}function gallery(b,type){let g=node('div',undefined,'gallery');if(type==='people')D.profiles.forEach((p,i)=>g.append(tile(p[1],p[0],()=>openProfile(i),'profile')));else D.memories.forEach((m,i)=>g.append(tile('memory'+(i+1),m[0],()=>openMemory(i+1))));b.append(g)}$('homeBtn').onclick=()=>show('home');$('peopleBtn').onclick=()=>gallery(dialog('저택의 세 사람','CHARACTERS'),'people');$('memoryBtn').onclick=()=>gallery(dialog('지난 기록','MEMORIES'),'memory');$('mapBtn').onclick=()=>{let b=dialog('저택의 공간','FLOOR GUIDE');for(let [title,ids] of [['1층',['2','3','4','10','11','14']],['2층',['15','6','7']],['정원과 주변',['12','8','5','9','13']]]){let g=node('div',undefined,'mapgroup');g.append(node('h3',title));ids.forEach(id=>g.append(button(D.rooms[id][0],()=>{close();show(id)})));b.append(g)}};$('logBtn').onclick=()=>{let b=dialog('발견 기록','ARCHIVE');b.append(node('p',`${seen.size} / ${Object.keys(D.objects).length}개의 기록을 발견했습니다.`));if(!seen.size)b.append(node('p','공간 속 작은 불빛을 눌러 기록을 발견하세요.'));for(let n of seen){if(D.objects[n])b.append(button(D.objects[n][0],()=>openObject(n),'more'))}};document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{time=b.dataset.time;show('home',false)});gallery($('gallery'),'memory');$('gallery').className='';
let ac,noise,gain;function audioContext(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume();return ac}function chime(){try{let a=audioContext();[880,1320,1760].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.17;o.frequency.value=f;o.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+1.4);o.connect(g).connect(a.destination);o.start(t);o.stop(t+1.5)})}catch(e){}}$('audioBtn').onclick=()=>{try{if(noise){noise.stop();noise=null;$('audioBtn').textContent='♪ 빗소리 켜기';$('audioBtn').setAttribute('aria-pressed','false');return}let a=audioContext(),buf=a.createBuffer(1,a.sampleRate*4,a.sampleRate),arr=buf.getChannelData(0),last=0;for(let i=0;i<arr.length;i++){last=(last+.025*(Math.random()*2-1))/1.025;arr[i]=last*8}noise=a.createBufferSource();noise.buffer=buf;noise.loop=true;let f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=2400;gain=a.createGain();gain.gain.value=.16;noise.connect(f).connect(gain).connect(a.destination);noise.start();$('audioBtn').textContent='♪ 빗소리 끄기';$('audioBtn').setAttribute('aria-pressed','true')}catch(e){$('audioBtn').textContent='음향 지원 안 됨'}};show('home',false);
</script></body></html>
