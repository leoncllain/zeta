*{box-sizing:border-box}body{margin:0;background:#fafafa;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}#app{max-width:540px;margin:auto;background:white;min-height:100dvh;position:relative}header{height:66px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid #eee;position:sticky;top:0;background:white;z-index:2}button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}header strong{font-size:21px}.spacer{flex:1}.icons{font-size:24px;letter-spacing:8px}.search{margin:18px 16px 22px;background:#f0f0f0;border-radius:12px;padding:12px;display:flex;gap:8px;color:#888}.search input{border:0;background:transparent;outline:none;width:100%;font:inherit}.label{display:flex;justify-content:space-between;padding:0 18px 10px;font-weight:700}.blue{color:#3897f0}.person{width:100%;display:flex;align-items:center;text-align:left;gap:14px;padding:14px 16px}.person:hover{background:#fafafa}.avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#d4dce9,#ead9dd);display:grid;place-items:center;color:#596174;font-size:22px;font-weight:700;flex-shrink:0}.avatar.love{background:linear-gradient(135deg,#ffdfeb,#f6a6c4);color:#b84270}.meta{min-width:0;flex:1}.meta strong{display:block;font-size:16px;margin-bottom:5px}.preview{color:#888;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{width:9px;height:9px;border-radius:50%;background:#3897f0}.footnote{margin:22px 18px;color:#aaa;font-size:11px;text-align:center}.profile{text-align:center;padding:35px 10px 24px}.profile .avatar{margin:0 auto 12px;width:82px;height:82px;font-size:29px}.profile p{color:#999;font-size:13px}.chat{padding:0 15px 20px;display:flex;flex-direction:column;gap:10px}.bubble{padding:11px 15px;max-width:80%;line-height:1.55;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}.l{align-self:flex-start;background:#efefef;border-radius:19px 19px 19px 5px}.r{align-self:flex-end;background:#3897f0;color:white;border-radius:19px 19px 5px 19px}.time{text-align:center;color:#999;font-size:12px;padding:15px 0}.compose{position:sticky;bottom:0;background:white;padding:10px 14px;border-top:1px solid #eee}.compose div{border:1px solid #ddd;border-radius:28px;padding:12px;color:#aaa;display:flex;align-items:center;gap:10px}.small{width:39px;height:39px;font-size:15px} .back{font-size:30px;padding:0 5px}.other{border-top:1px solid #eee;margin:10px 16px;padding:20px 0;display:flex;align-items:center;gap:12px}.badge{background:#3897f0;color:white;border-radius:20px;padding:5px 9px;font-size:12px} @media(min-width:600px){#app{border-left:1px solid #eee;border-right:1px solid #eee}}
